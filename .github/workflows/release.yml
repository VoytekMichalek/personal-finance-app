name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  # Serialize releases because they share the latest image and production app.
  group: release-production
  cancel-in-progress: false
jobs:
  validate:
    # Reuse this repository's validation; no external CI wrapper is involved.
    uses: ./.github/workflows/ci.yml
  publish:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
      - run: node scripts/release-check.mjs
      - name: Check deployment configuration before publication
        env:
          DOKPLOY_DEPLOY_WEBHOOKS: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOKS }}
        run: node scripts/deploy-dokploy.mjs --check
      - name: Build immutable release candidate
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: docker build --build-arg APP_VERSION="${RELEASE_TAG#v}" --build-arg RELEASE_TAG="$RELEASE_TAG" --build-arg BUILD_COMMIT="$GITHUB_SHA" -t personal-finance:verification .
      - run: node scripts/smoke-image.mjs
      - uses: aquasecurity/trivy-action@c03d123cb480c08c69b054af418ea5e69fe6e57e
        with:
          image-ref: personal-finance:verification
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish checked image and release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/voytekmichalek/personal-finance-app:$RELEASE_TAG"
          docker tag personal-finance:verification "$image"
          docker push "$image"
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file artifacts/release-notes.md
          docker tag personal-finance:verification ghcr.io/voytekmichalek/personal-finance-app:latest
          docker push ghcr.io/voytekmichalek/personal-finance-app:latest
          docker inspect --format '{{join .RepoDigests "\n"}}' personal-finance:verification >> "$GITHUB_STEP_SUMMARY"
  deploy:
    name: Deploy to personal Dokploy
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment:
      name: production
      url: https://finance.michalek.app
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
      - name: Request rollout and verify the running release
        env:
          DOKPLOY_DEPLOY_WEBHOOKS: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOKS }}
          RELEASE_TAG: ${{ github.ref_name }}
          BUILD_COMMIT: ${{ github.sha }}
        run: node scripts/deploy-dokploy.mjs
