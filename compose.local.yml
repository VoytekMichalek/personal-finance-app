services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: local-finance-only
      POSTGRES_DB: finance
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["finance-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  finance-data:
